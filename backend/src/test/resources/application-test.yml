spring:
  datasource:
    url: jdbc:h2:mem:mantis-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 25
app:
  mail:
    enabled: false
  api:
    rate-limit:
      enabled: false
    attachment:
      max-size-bytes: 1024          # keeps the attachment-limit test small
