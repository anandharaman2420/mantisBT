name: CI

on:
  push:
    branches: [main, phase-2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  importer:
    name: Importer tests (MantisBT data migration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pgserver psycopg2-binary pymysql

      # starts an embedded PostgreSQL, loads a nasty MantisBT fixture, runs tools/import_mantis.py and checks every table;
      # the target schema is generated from the JPA entities, so a renamed column breaks this job.
      # (The same suite against a MySQL source: tools/tests/test_importer_mysql.py, needs a local mysqld - see IMPORT.md)
      - name: Importer end-to-end tests
        working-directory: tools/tests
        run: python -m unittest test_importer -v

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mantis-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t mantis-frontend:ci ./frontend

